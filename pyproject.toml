[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marswalk"
version = "0.0.1"
description = "Marswalk Planner — layered, uncertainty-aware EVA route planning for a Martian AOI (NASA Space Apps 2026)."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Marswalk Planner team" }]
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "networkx>=3.2",   # independent shortest-path oracle for tests only
    "ruff>=0.5",
    "pre-commit>=3.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/marswalk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.ruff.lint.isort]
known-first-party = ["marswalk"]
