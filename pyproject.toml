[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marswalk"
version = "0.0.1"
description = "Marswalk Planner — layered, uncertainty-aware EVA route planning for a Martian AOI (NASA Space Apps 2026)."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Marswalk Planner team" }]
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.6",
]

[project.scripts]
marswalk = "marswalk.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "networkx>=3.2",   # independent shortest-path oracle for tests only
    "ruff>=0.5",
    "pre-commit>=3.6",
    "fastapi>=0.110",
    "httpx>=0.27",     # FastAPI TestClient
]
api = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
viz = [
    "matplotlib>=3.8",   # offline figure rendering (scripts/render_mission_figure.py)
]
# Owner machines only (network/GPU; UNTESTED in CI sandbox):
geo = ["rasterio>=1.3"]
spice = ["spiceypy>=6.0"]
ml = ["torch>=2.2", "torchvision>=0.17", "pillow>=10.0"]
nb = ["jupyter>=1.0", "torch>=2.2", "torchvision>=0.17", "pillow>=10.0"]  # training notebook

[tool.hatch.build.targets.wheel]
packages = ["src/marswalk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"
# Lint the shipped package + tests strictly; notebooks (Colab deliverables) and
# one-off scripts/demos are not part of the library's lint surface.
extend-exclude = ["notebooks", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
# Compact multi-statement lines (`a; b`) are used deliberately in demos/ML code;
# (str, Enum) is valid on py311 (StrEnum modernization optional). Correctness
# rules (F, B, imports, line-length) stay strict.
ignore = ["E701", "E702", "UP042"]

[tool.ruff.lint.isort]
known-first-party = ["marswalk"]
